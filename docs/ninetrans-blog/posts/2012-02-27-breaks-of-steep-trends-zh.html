      <h1>陡峭趋势的突破</h1>
      <p><a href="https://ninetrans.blogspot.com/2012/02/breaks-of-steep-trends.html">https://ninetrans.blogspot.com/2012/02/breaks-of-steep-trends.html</a></p>
      <div class="separator" style="clear: both; text-align: center;"><a href="../images/2012-02-27-breaks-of-steep-trends-01-4d21028f41.png" target="_blank"><img border="0" src="../images/2012-02-27-breaks-of-steep-trends-01-4d21028f41.png" /></a></div><br />
当趋势非常陡峭时，比如从b5到b23的走势，整个运动就像一条腿，通常表现为尖峰加通道的形态，其中通道充当尖峰的第二条腿。通常，大部分动能在尖峰阶段就已耗尽，导致通道的坡度相对较浅。<br />
<br />
由于通道是楔形（W），你应该预期出现三次推高，然后测试通道起点（b35低点），这可能在次日发生。<br />
<br />
由于通道是弱势趋势，如果其宽度足以交易，你仍然可以在第三次推高完成之前采取A2和其他深度两腿回撤的交易方式。
    </article>
