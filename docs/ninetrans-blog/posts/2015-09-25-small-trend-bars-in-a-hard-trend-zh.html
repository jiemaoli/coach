<br />
当前两根K线收盘强势且几乎没有重叠时，可以合理地假设硬趋势正在进行中。在硬趋势中，任何小K线都可以用作信号K线，特别是在趋势线附近的趋势K线（b3）。在回调中，你可以在任何小型趋势K线（b10）上方入场。<br />
