      <h1>趋势加速</h1>
      <p><a href="https://ninetrans.blogspot.com/2013/02/trend-acceleration.html">https://ninetrans.blogspot.com/2013/02/trend-acceleration.html</a></p>
      <br />
<div class="separator" style="clear: both; text-align: center;">
<a href="../images/2013-02-06-trend-acceleration-01-a801ccfcc9.png" target="_blank"><img border="0" src="../images/2013-02-06-trend-acceleration-01-a801ccfcc9.png" /></a><a href="../images/2013-02-06-trend-acceleration-02-fc6fa468c6.png" target="_blank"><img border="0" src="../images/2013-02-06-trend-acceleration-02-fc6fa468c6.png" /></a></div>
<br />
趋势通常会随时间变得平坦，但有时（通常是由于新闻驱动）趋势实际上会加速。这表现为价格形成越来越陡峭的趋势线。这种加速最终会暂停，并可能反转整个走势，或者像今天这样进入延伸回撤。<br />
<br />
加速趋势通常是强势趋势（Hard Trend），你可以买入浅回撤和单腿回撤。请注意，要构成强势趋势，你需要看到非常大的顺势运动和非常浅的逆势运动。一旦浅回撤不再有效，或者你看到深度回撤，强势趋势很可能就结束了。
