<br />
今天从b1到b8开盘即震荡。从b8到b11，K线突然出现了强势收盘和较短的影线。这是震荡即将结束的信号。<br />
<br />
当震荡结束时，初始运动通常可以逆势交易。今天的情况是初始运动向上延续，结果导致了一波大跌。相反，如果初始运动是向下的，我们可能看到趋势向上突破。
