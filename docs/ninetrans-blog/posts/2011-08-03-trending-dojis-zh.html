      <h1>趋势性十字星</h1>
      <p><a href="https://ninetrans.blogspot.com/2011/08/trending-dojis.html">https://ninetrans.blogspot.com/2011/08/trending-dojis.html</a></p>
      <div class="separator" style="clear: both; text-align: center;"><a href="../images/2011-08-03-trending-dojis-01-688e8308d4.png" target="_blank"><img border="0" src="../images/2011-08-03-trending-dojis-01-688e8308d4.png" /></a></div><br />趋势性十字星（b35-41、b61-66）是迷你趋势。它们在较小时间框架上是小型趋势运动，在较大时间框架上则是一根大趋势K线。当你看到趋势性十字星时，正确的做法是在回调K线上顺势入场。<br /><br />显然，大多数交易者确实这样做了，因为b43和b68的低点被毫不犹豫地买入，每次都有出色的行情。如果你对限价买入空头趋势K线的收盘感到不安，完全可以等待下一个K线是否为多头，然后在其收盘价买入，或者在其高点上方买入——如果它不是太大的话。
    </article>
