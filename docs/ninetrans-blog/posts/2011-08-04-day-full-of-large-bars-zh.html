      <h1>充满大K线的一天</h1>
      <p><a href="https://ninetrans.blogspot.com/2011/08/day-full-of-large-bars.html">https://ninetrans.blogspot.com/2011/08/day-full-of-large-bars.html</a></p>
      <div class="separator" style="clear: both; text-align: center;"><a href="../images/2011-08-04-day-full-of-large-bars-01-c9e57286c0.png" target="_blank"><img border="0" src="../images/2011-08-04-day-full-of-large-bars-01-c9e57286c0.png" /></a></div><br />当K线很大时，你的风险也很大。虽然彼此之间的比例看起来合理，但每份合约的资金风险更大，因此你需要通过减少仓位来适应。另一件需要做的事是只在回调风险较低的交易中入场。<br /><br />在趋势日正确入场的A2，往往具有较低的不利波动（b49、b69）。尽管b69有4.25点，但其不利波动仅为1.25点。其他低回调的设置是W1P和G2。<br /><br />最好避免具有大幅回调可能性的设置，例如内包线反转（b29）和双K线反转（b10、11）。
    </article>
