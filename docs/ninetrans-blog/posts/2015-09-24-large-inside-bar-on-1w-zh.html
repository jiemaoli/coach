      <h1>1W上的大型内包线</h1>
      <p><a href="https://ninetrans.blogspot.com/2015/09/large-inside-bar-on-1w.html">https://ninetrans.blogspot.com/2015/09/large-inside-bar-on-1w.html</a></p>

<a href="../images/2015-09-24-large-inside-bar-on-1w-01-95c5843ce5.png" target="_blank"><img border="0" height="398" src="../images/2015-09-24-large-inside-bar-on-1w-01-95c5843ce5.png" width="640" /></a></div>

<div class="separator" style="clear: both; text-align: center;">
<a href="../images/2015-09-24-large-inside-bar-on-1w-02-ccd13c4604.png" target="_blank"><img border="0" height="122" src="../images/2015-09-24-large-inside-bar-on-1w-02-ccd13c4604.png" width="640" /></a></div>
<br />
内包线比较棘手，通常需要经验判断才能正确交易。一般而言，大型内包线就是重叠区域，因此是一个迷你震荡区间。通常最好等待交易触发后再入场，然后在回调时进场。<br />
<br />
一根外包线（b23）如果不太大，能套住那些没有看到反转而入场的交易者，就是一个极好的信号K线。如果它没有触发，之后的任何小型趋势K线（b24）都应该有效。<br />
<br />
