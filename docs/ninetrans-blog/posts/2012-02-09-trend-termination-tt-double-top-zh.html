      <h1>趋势终结（TT）：双顶</h1>
      <p><a href="https://ninetrans.blogspot.com/2012/02/trend-termination-tt-double-top.html">https://ninetrans.blogspot.com/2012/02/trend-termination-tt-double-top.html</a></p>
      <div class="separator" style="clear: both; text-align: center;"><a href="../images/2012-02-09-trend-termination-tt-double-top-01-5043238968.png" target="_blank"><img border="0" src="../images/2012-02-09-trend-termination-tt-double-top-01-5043238968.png" /></a></div><br />
新趋势中的第一次回调通常是最深的，随后的回调会越来越浅。随着回调变浅，它们吸引的新买家会减少，因为买入回调的盈利能力与回调深度成正比。<br />
<br />
最终，回调变得如此之浅（b52、b58），以至于找不到买家，早期买家会在高位附近退出。这将导致双顶或双顶，并终结趋势。<br />
<br />
由于这是终结而非趋势反转，你需要等待新趋势突破后再进场交易，或者只交易fBO。
