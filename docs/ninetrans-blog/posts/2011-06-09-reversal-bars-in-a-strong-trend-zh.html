      <h1>强趋势中的反转K线</h1>
      <p><a href="https://ninetrans.blogspot.com/2011/06/reversal-bars-in-strong-trend.html">https://ninetrans.blogspot.com/2011/06/reversal-bars-in-strong-trend.html</a></p>
      <div class="separator" style="clear: both; text-align: center;"><a href="../images/2011-06-09-reversal-bars-in-a-strong-trend-01-552e87b157.png" target="_blank"><img border="0" src="../images/2011-06-09-reversal-bars-in-a-strong-trend-01-552e87b157.png" /></a></div><br />在极端强势趋势的日子里，反转K线（b17、b33）看起来很漂亮，但通常只能带来剥头皮级别的利润。而顺势入场的K线看起来形态较差（b2、b12、b24、b38、b50），但往往能带来合理的利润。<br /><br />当顺势入场的K线突然变得形态很好（b62），而反转信号看起来很差（b67）时，我通常会对反转保持怀疑。这是一个很好的出场位置，可以根据价格行为反转仓位。
    </article>
