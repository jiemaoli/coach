      <h1>熊市反弹</h1>
      <p><a href="https://ninetrans.blogspot.com/2011/08/bear-rallies.html">https://ninetrans.blogspot.com/2011/08/bear-rallies.html</a></p>
      <div class="separator" style="clear: both; text-align: center;"><a href="../images/2011-08-08-bear-rallies-01-d88c8ce007.png" target="_blank"><img border="0" src="../images/2011-08-08-bear-rallies-01-d88c8ce007.png" /></a></div><br />通常最强的多头运动出现在强势空头中的失败突破。像b1-2、b14-21和b60-70这样的运动看起来非常强劲，但最终都成为了失败突破。<br /><br />b2作为单根K线多头运动失败，b21作为A2失败，b71作为缺口K线失败。在像这样的超宽幅日中，即使逆主趋势也可以波段获利相当大的距离。然而，顺主趋势的波段显然会表现得更好。<br /><br />在强势空头中，始终要警惕失败突破。你可以通过只做两腿反弹来减少逆势持仓的风险暴露。例如，b67在可能的反转之后是一个两腿反弹。
    </article>
