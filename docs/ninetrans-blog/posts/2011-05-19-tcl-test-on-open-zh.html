      <h1>开盘时的TCL测试</h1>
      <p><a href="https://ninetrans.blogspot.com/2011/05/tcl-test-on-open.html">https://ninetrans.blogspot.com/2011/05/tcl-test-on-open.html</a></p>
      <div class="separator" style="clear: both; text-align: center;"><a href="../images/2011-05-19-tcl-test-on-open-01-96a655c174.png" target="_blank"><img border="0" src="../images/2011-05-19-tcl-test-on-open-01-96a655c174.png" /></a></div><br />开盘时的TCL测试可能预示着上午趋势的方向。对一个或多个昨日TCL的第二次失败突破过度，可能预示着反转，或者至少是远离TCL的2个点的运动。<br /><br />当缺口较小时，这可以简单地视为高潮K线和突破过度TCL时的W型反转。如果缺口较大，通常会导致反转K线的形成，并可能从第1根K线开始趋势。<br /><br />绘制前一天的TCL可以防止你在错误方向上入场，在强劲的趋势日或两天后尤其有帮助。
    </article>
