      <h1>楔形回撤</h1>
      <p><a href="https://ninetrans.blogspot.com/2011/07/wedge-pullback.html">https://ninetrans.blogspot.com/2011/07/wedge-pullback.html</a></p>
      <div class="separator" style="clear: both; text-align: center;"><a href="../images/2011-07-26-wedge-pullback-01-fe185e54bd.png" target="_blank"><img border="0" src="../images/2011-07-26-wedge-pullback-01-fe185e54bd.png" /></a></div><br />午间低动能的三推回撤就是一个楔形回撤（WP），通常是良好的入场信号。在趋势日中，这种走势通常会在接近EMA处结束。在像今天这样的震荡区间日中，它通常会对之前的摆动低点给出三推fBO（b52跌破了b27）。<br /><br />这往往也可能是一个G或G2交易，在先前存在同方向趋势的情况下，通常是高概率交易。楔形回撤常常构成复杂午间回撤的一部分。
