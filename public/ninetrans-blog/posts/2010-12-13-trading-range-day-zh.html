      <h1>交易区间日</h1>
      <p><a href="https://ninetrans.blogspot.com/2010/12/trading-range-day.html">https://ninetrans.blogspot.com/2010/12/trading-range-day.html</a></p>
      <br />
<div>
<div class="separator" style="clear: both; text-align: center;">
<a href="../images/2010-12-13-trading-range-day-01-cd2e45a2c9.png" target="_blank"><img border="0" height="423" src="../images/2010-12-13-trading-range-day-01-cd2e45a2c9.png" width="640" /></a></div>
<br />
在强劲的信号K线和入场K线之后，看起来很有希望的趋势日很快就变成了小波动区间日。第一次反转通常看起来很糟糕，但会转头测试当天高点。b16突破了日内高点（HOD），在b25给出了可能的突破失败（BF）信号，但在午间时段几乎没有后续跟进。三角形整理在b52突破为扩展三角形，导致第二次尝试突破HOD。当第二次尝试失败时，市场迅速下跌。</div>
<div>
<br /></div>
<div>
一般来说，交易区间失败会给出与区间大小相等的测量目标位，所以我们应该预期价格在隔夜或明天会触及1228左右。</div>
