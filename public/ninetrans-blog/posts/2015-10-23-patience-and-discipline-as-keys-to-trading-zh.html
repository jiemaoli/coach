      <h1>耐心与纪律是交易的关键</h1>
      <p><a href="https://ninetrans.blogspot.com/2015/10/patience-and-discipline-as-keys-to.html">https://ninetrans.blogspot.com/2015/10/patience-and-discipline-as-keys-to.html</a></p>
      <div class="separator" style="clear: both; text-align: center;">
<br /><iframe width="320" height="266" class="YOUTUBE-iframe-video" data-thumbnail-src="https://i.ytimg.com/vi/tavVeRJ0qe0/0.jpg" src="https://www.youtube.com/embed/tavVeRJ0qe0?feature=player_embedded" frameborder="0" allowfullscreen></iframe></div>
<br />
交易的关键不仅仅在于做对的交易，还在于放弃那些看起来不对的交易。毕竟，随便做每笔交易然后忽略失败很容易，但这只会让你的经纪商变富。<br />
<br />
当价格行为震荡或信号较弱时，等待市场离开并给出更好的设定。这就是耐心，也是限制亏损的关键。<br />
<br />
一旦你进入了交易，就要遵循你的交易计划。不要被震出局。在你认为合理且保守的位置出场。不要贪婪，否则你的盈利交易可能变成亏损交易。
