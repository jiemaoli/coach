      <h1>双重楔形</h1>
      <p><a href="https://ninetrans.blogspot.com/2011/11/double-wedge.html">https://ninetrans.blogspot.com/2011/11/double-wedge.html</a></p>
      <div class="separator" style="clear: both; text-align: center;"><a href="../images/2011-11-16-double-wedge-01-eb8a903554.png" target="_blank"><img border="0" src="../images/2011-11-16-double-wedge-01-eb8a903554.png" /></a></div><br />
双重楔形就是两个楔形终止于同一根K线。在上面的图表中，可以认为有两个楔形W 6,24,52和W 34,39,52或其他变体。双重楔形可以引发一波大行情（b63-b81）。<br />
<br />
要形成双重楔形，从最近的摆动点（b24）开始的回撤需要足够深，使得下一段行情可能需要多次推动才能突破。由逆势K线（CT bars）组成的强劲深度走势（b24-33）也可能展示出逆势力量，这会促使顺势交易者退出，逆势交易者在摆动点（b24上方）入场。
