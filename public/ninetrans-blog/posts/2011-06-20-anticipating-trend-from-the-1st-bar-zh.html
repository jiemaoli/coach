      <h1>从第1根K线预判趋势</h1>
      <p><a href="https://ninetrans.blogspot.com/2011/06/anticipating-trend-from-1st-bar.html">https://ninetrans.blogspot.com/2011/06/anticipating-trend-from-1st-bar.html</a></p>
      <div class="separator" style="clear: both; text-align: center;"><a href="../images/2011-06-20-anticipating-trend-from-the-1st-bar-01-e9f282ed05.png" target="_blank"><img border="0" src="../images/2011-06-20-anticipating-trend-from-the-1st-bar-01-e9f282ed05.png" /></a></div><br />大幅跳空可以帮助你预判趋势日，但更重要的是对当日极值的反转。今天的b1反转了前一日b70的低点（LOD），而前一日后半段表现出足够的强度，让我们预期至少会测试昨日高点。<br /><br />如果第一次反转极值失败，在一小时内进行的第二次反转尝试也是非常好的早期趋势信号。这里的入场可以做波段，至少可以拿到前一日一两个摆动点之上。<br /><br />保守的交易者可以在b11上方的1PB入场，前提是EMA处两次做空尝试均失败。
