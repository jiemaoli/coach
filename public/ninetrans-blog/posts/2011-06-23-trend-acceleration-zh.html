      <h1>趋势加速</h1>
      <p><a href="https://ninetrans.blogspot.com/2011/06/trend-acceleration.html">https://ninetrans.blogspot.com/2011/06/trend-acceleration.html</a></p>
      <div class="separator" style="clear: both; text-align: center;"><a href="../images/2011-06-23-trend-acceleration-01-b348883466.png" target="_blank"><img border="0" src="../images/2011-06-23-trend-acceleration-01-b348883466.png" /></a></div><br />趋势线被突破（b7-9）后成功测试极值（b17）是一个主要反转信号。但当趋势线被突破（b32-36）而对高点的测试失败（b41-44）时，趋势很可能加速，产生更大的波动。这就是为什么在趋势线首次被突破时始终沿趋势方向入场是一个好主意。如果趋势加速，它会形成由新趋势线支撑的新趋势（b17,37）。<br /><br />早盘的强势（b6-8）往往预示着后续的强劲走势，如果没有这种早盘强势，你可能希望放弃在趋势突破处做多，除非有非常出色的形态。
    </article>
