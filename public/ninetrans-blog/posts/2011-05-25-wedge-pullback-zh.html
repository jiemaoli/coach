      <h1>楔形回撤</h1>
      <p><a href="https://ninetrans.blogspot.com/2011/05/wedge-pullback.html">https://ninetrans.blogspot.com/2011/05/wedge-pullback.html</a></p>
      <div class="separator" style="clear: both; text-align: center;"><a href="../images/2011-05-25-wedge-pullback-01-aa22285f3c.png" target="_blank"><img border="0" src="../images/2011-05-25-wedge-pullback-01-aa22285f3c.png" /></a></div><br />中午时分的低动量、低成交量三次推动回撤（b34，40，48）是一个楔形回撤，通常像A2一样工作。这笔交易有几个积极因素。它的行为类似于BW fBO、A2和W反转的结合。<br /><br />如果出现强劲趋势K线且没有后续，这笔交易的成功概率会增加。小型内包趋势K线或任何小型趋势反转K线增加了延续的机会。缺口K线或G2入场增加了价格突破极端点的机会。<br /><br />WP通常应该作为波段入场，特别是当上午趋势强劲时。
    </article>
