    <article data-source="ninetrans.blogspot.com">
      <h1>当反转K线不触发时</h1>
      <p><a href="https://ninetrans.blogspot.com/2012/02/when-reversal-bars-dont-trigger.html">https://ninetrans.blogspot.com/2012/02/when-reversal-bars-dont-trigger.html</a></p>
      <div class="separator" style="clear: both; text-align: center;"><a href="../images/2012-02-14-when-reversal-bars-dont-trigger-01-af05a792e5.png" target="_blank"><img border="0" src="../images/2012-02-14-when-reversal-bars-dont-trigger-01-af05a792e5.png" /></a></div><br />
浅斜率、宽通道甚至会愚弄最好的交易者，让他们认为反转即将到来。有一些方法可以猜测反转是否会失败，其中之一是具有强收盘的反转K线拒绝触发。例如今天，b9、b18、b45尽管有强收盘但拒绝触发。这通常意味着卖家在卖出强K线的收盘价而不是买入。这也显示了买方缺乏信心，你应该寻找原始方向的延续交易。<br />
<br />
TCL的突破过度和强信号，如b73处的oio，是做反转交易并希望成功的必要条件。
    </article>
