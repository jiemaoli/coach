    <article data-source="ninetrans.blogspot.com">
      <h1>趋势线突破后的通道</h1>
      <p><a href="https://ninetrans.blogspot.com/2011/07/channel-after-trendline-break.html">https://ninetrans.blogspot.com/2011/07/channel-after-trendline-break.html</a></p>
      <div class="separator" style="clear: both; text-align: center;"><a href="../images/2011-07-28-channel-after-a-trendline-break-01-6b774e6377.png" target="_blank"><img border="0" src="../images/2011-07-28-channel-after-a-trendline-break-01-6b774e6377.png" /></a></div><br />趋势线突破后的通道（b35-48在b32-34之后）通常是新趋势的第一腿。如果它给出两腿回调（b49-53），应该入场交易可能的第二腿，这通常是更强的走势（b55-62）。无论原始趋势的方向如何，新通道更有可能决定至少下一段走势的方向。<br /><br />如果两腿回调非常强劲，它可能打破通道趋势线并最终反转通道。这种情况通常罕见，但偶尔确实会发生。
