      <h1>最佳交易</h1>
      <p><a href="https://ninetrans.blogspot.com/2011/01/非常-best-trades.html">https://ninetrans.blogspot.com/2011/01/非常-best-trades.html</a></p>
      <div dir="ltr" style="text-align: left;" trbidi="on"><div class="separator" style="clear: both; text-align: center;"><a href="../images/2011-01-25-the-very-best-trades-01-8579a32911.png" target="_blank"><img border="0" src="../images/2011-01-25-the-very-best-trades-01-8579a32911.png" /></a></div><br />今天可能有数百笔交易，但今天是我最喜欢交易的绝佳样本。第一次回撤（1PB（第一次回调））、EMA（指数移动平均线）附近的两腿回调（A2（两腿到均线的回调））、双顶或双底和回撤（DP）、楔形反转后的第一次回撤（W1P（楔形反转后第一次回调））。最大的行情来自这些交易，当我能及时解读它们时，我确保入场。今天我错过了b54的DP以及可能的b18的A2或1PB。<br /><br />只交易这四种仍然会让你保持盈利，即使只有50%的成功率，因为它们经常走到+4个点。<br /><br /><br /></div>
