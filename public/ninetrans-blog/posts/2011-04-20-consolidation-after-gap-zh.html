      <h1>缺口后的整理</h1>
      <p><a href="https://ninetrans.blogspot.com/2011/04/consolidation-after-gap.html">https://ninetrans.blogspot.com/2011/04/consolidation-after-gap.html</a></p>
      <div dir="ltr" style="text-align: left;" trbidi="on"><div class="separator" style="clear: both; text-align: center;"><a href="../images/2011-04-20-consolidation-after-gap-01-e0b6b83216.png" target="_blank"><img border="0" src="../images/2011-04-20-consolidation-after-gap-01-e0b6b83216.png" /></a></div><br />在大幅跳空高开之后出现的窄幅横盘日，通常是一个整理日。这时候隔夜交易者获利了结，而错过大行情的交易者进场。通常这会在一两天内导致一个大幅度的单边走势。<br /><br />如果第二天跳空低开，可能导致一波大幅下跌，其原理与日线图上的岛形反转类似。<br /><br />这样的交易日按照普通的交易区间日来交易即可，如果你交易了任何两段式走势，你大概率做得不错。</div>
    </article>
