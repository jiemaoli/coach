      <h1>失败突破与突破回踩</h1>
      <p><a href="https://ninetrans.blogspot.com/2011/08/failed-breakouts-and-breakout-pullbacks.html">https://ninetrans.blogspot.com/2011/08/failed-breakouts-and-breakout-pullbacks.html</a></p>
      <div class="separator" style="clear: both; text-align: center;"><a href="../images/2011-08-15-failed-breakouts-and-breakout-pullbacks-01-9528e1611c.png" target="_blank"><img border="0" src="../images/2011-08-15-failed-breakouts-and-breakout-pullbacks-01-9528e1611c.png" /></a></div><br /><br />在，如果突破给出了很差的信号K线（b60）或未触发（b65），或者两次都未能回到区间内，我通常会转而寻找BP（突破回踩）。<br /><br />第二种选择是将失败的L2识别为软趋势走势，在下一个信号K线（b36或可能是b38、b53、b73）上方做多。勇敢的交易者可以在第二次尝试收盘时以限价单买入，止损设在下一根较低的牛K线下方，或使用紧止损。
