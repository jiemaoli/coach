      <h1>强劲楔形</h1>
      <p><a href="https://ninetrans.blogspot.com/2011/05/strong-wedge.html">https://ninetrans.blogspot.com/2011/05/strong-wedge.html</a></p>
      <div dir="ltr" style="text-align: left;" trbidi="on"><div class="separator" style="clear: both; text-align: center;"><a href="../images/2011-05-16-strong-wedge-01-219447bb29.png" target="_blank"><img border="0" src="../images/2011-05-16-strong-wedge-01-219447bb29.png" /></a></div><br />一个楔形如果明显超越趋势通道线（TCL），但K线尺寸合理，通常是非常强劲的楔形，尤其当它以反转K线结束时。这种楔形可能难以解读，因为在强劲上涨之后测试高点通常是常态而非例外。如果b21处有一根更强的入场K线，或许会让这个楔形反转更容易识别。<br /><br />正常楔形可以预期回调到第一次回调的起点，即今天的b5低点。这解释了b45到b56的买入行为。然而，楔形反转失败了，价格跌破了b45。这表明非常强劲的下跌行情，通常会走出楔形顶部的测量目标。</div>
