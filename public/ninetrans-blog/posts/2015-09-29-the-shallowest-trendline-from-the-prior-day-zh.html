      <h1>前一交易日的最浅趋势线</h1>
      <p><a href="https://ninetrans.blogspot.com/2015/09/the-shallowest-trendline-from-prior-day.html">https://ninetrans.blogspot.com/2015/09/the-shallowest-trendline-from-prior-day.html</a></p>
      <br />
<div class="separator" style="clear: both; text-align: center;">
<a href="../images/2015-09-29-the-shallowest-trendline-from-the-prior-day-01-207788afd6.png" target="_blank"><img border="0" height="430" src="../images/2015-09-29-the-shallowest-trendline-from-the-prior-day-01-207788afd6.png" width="640" /></a></div>
<div class="separator" style="clear: both; text-align: center;">
<a href="../images/2015-09-29-the-shallowest-trendline-from-the-prior-day-02-3b0da07685.png" target="_blank"><img border="0" height="40" src="../images/2015-09-29-the-shallowest-trendline-from-the-prior-day-02-3b0da07685.png" width="640" /></a></div>
<br />
每天都有一个最浅的多头趋势线和一个最浅的空头趋势线。这些趋势线对价格可能在何处反转和形成趋势具有一定的预测能力。例如，前一日从最高点和b21画出的最浅空头趋势线引发了一次反应，导致了一波大行情。如果最后一根K线是当日的最高或最低K线，那么你可以改用通道趋势线（TCL），但其预测价值较低。<br />
<br />
注意，当价格相对于前一交易日大幅跳空时，前一日的最浅趋势线可能永远不会被测试，你不应该等待它。
