    <article data-source="ninetrans.blogspot.com">
      <h1>微型通道</h1>
      <p><a href="https://ninetrans.blogspot.com/2011/07/micro-channels.html">https://ninetrans.blogspot.com/2011/07/micro-channels.html</a></p>
      <div class="separator" style="clear: both; text-align: center;"><a href="../images/2011-07-20-micro-channels-01-5e97463c81.png" target="_blank"><img border="0" src="../images/2011-07-20-micro-channels-01-5e97463c81.png" /></a></div><br />延伸的微型通道通常意味着反转，在趋势日和交易区间日都经常出现。在一段延伸的趋势运动之后，顺势微型通道代表趋势线突破以及更高的高点或更低的低点测试，往往预示着反转。<br /><br />在交易区间日，它们代表向区间一端的弱势运动，通常会崩溃，并可能向任一方向突破形成趋势。超过20根K线的微型通道失去任何预测价值。<br /><br />微型通道的交易方式与其他通道相同。突破后两腿回撤是顺势交易（沿微型通道方向），突破后两腿测试则代表反转。
    </article>
